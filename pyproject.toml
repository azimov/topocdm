[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topocdm"
version = "0.1.0"
description = "A fixed-density generative topology model of an OMOP CDM, with a likelihood"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamie Gilbert" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.4"]
test = [
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "duckdb>=0.9",
]
databricks = [
    "PyYAML>=6.0",
    "databricks-sql-connector[pyarrow]>=3.0",
]

[tool.setuptools]
packages = ["topocdm"]

[tool.ruff]
line-length = 100
exclude = [".venv", "data", "results", "figs", ".mplconfig"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live OMOP CDM; set CDM_DSN",
    "databricks: needs a live Databricks warehouse and connection card",
]
