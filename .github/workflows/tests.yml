name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install -U pip
          pip install tox tox-gh-actions

      - name: Load the OMOP test database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -f tests/fixtures/omop_test.sql

      - name: Tests (tox)
        run: tox
        env:
          CDM_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CDM_SCHEMA: cdm
          CDM_RESULTS_SCHEMA: public

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
