name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,test]"
      - name: Build the optional C kernel
        run: CC=gcc bash scripts/build_fast.sh
      - name: Lint (syntax and undefined names)
        run: ruff check .
      - name: Load the OMOP test database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -f tests/fixtures/omop_test.sql
      - name: Unit and integration tests
        run: pytest -q
        env:
          CDM_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CDM_SCHEMA: cdm
